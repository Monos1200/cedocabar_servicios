<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b2545">
    <title>CEDOCABAR | Control de Soporte Técnico</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="manifest" href="manifest.json">
    
    <!-- Bootstrap 5.3 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-cedocabar d-flex align-items-center justify-content-center p-3">

    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-ring mb-3"></div>
        <h6 class="text-white fw-bold tracking-wide mb-0">CEDOCABAR</h6>
        <small class="text-white-50">Departamento de Gestión Tecnológica</small>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-9 col-md-6 col-lg-4">
                <div class="card card-institucional p-4">
                    
                    <!-- Cabecera Institucional con Logo Oficial sin fondo blanco -->
                    <div class="header-badge-navy text-center mb-4">
                        <img src="img/logo.png" alt="Logo CEDOCABAR" 
                             class="mb-2" 
                             style="width: 100px; height: 100px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45));">
                        <h4 class="fw-bold mb-0">CEDOCABAR</h4>
                        <p class="small mb-0 opacity-75">Control de Soporte Técnico</p>
                    </div>

                    <!-- Formulario Login -->
                    <form id="formLogin" autocomplete="off">
                        <div class="mb-3">
                            <label for="usuario" class="form-label fw-semibold small text-secondary">Usuario Técnico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-badge text-primary"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="usuario" placeholder="Ingrese su usuario" required autocomplete="off">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="clave" class="form-label fw-semibold small text-secondary">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock text-primary"></i></span>
                                <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="clave" placeholder="••••••••" required autocomplete="new-password">
                                <button class="btn btn-light border border-start-0" type="button" id="toggleClave">
                                    <i class="bi bi-eye" id="iconoClave"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-navy w-100 py-2 rounded-3" id="btnIngresar">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                        </button>
                    </form>

                    <!-- Botón instalación PWA (se muestra si el navegador lo permite) -->
                    <div id="pwaInstallContainer" class="mt-3 d-none">
                        <button type="button" id="btnInstallPWA" class="btn btn-outline-primary btn-sm w-100 rounded-3">
                            <i class="bi bi-phone me-1"></i> Instalar App en el Teléfono
                        </button>
                    </div>

                    <div class="text-center mt-4 pt-2 border-top">
                        <small class="text-muted" style="font-size: 0.75rem;">
                            Departamento de Gestión Tecnológica &bull; CEDOCABAR &copy; 2026
                        </small>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
